<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محدد الكسور المرجعية الذكي</title>
    <style>
        :root {
            --bg: #f0f9ff;
            --card: #ffffff;
            --primary: #0284c7;
            --accent: #f59e0b;
            --success: #10b981;
            --text: #1e293b;
        }
        
        * {
            box-sizing: border-box;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 10px; /* ملاءمة الحواف الخارجية للحجم الجديد */
            overflow: hidden; /* منع التمرير في الصفحة */
        }
        
        /* تكبير حجم البطاقة بنسبة 10% إضافية (من 385px إلى 424px) */
        .main-card { 
            background: var(--card); 
            border-radius: 1.45rem; 
            padding: 16px 19px; /* زيادة حشو البطاقة */
            box-shadow: 0 12px 24px rgba(0,0,0,0.06); 
            width: 100%; 
            max-width: 424px; 
            text-align: center; 
            border: 3.5px solid #fff; 
        }

        /* تكبير حجم عرض الكسر الأساسي بنسبة 10% إضافية (من 2.0rem إلى 2.2rem) */
        .main-frac { 
            display: inline-flex; 
            flex-direction: column; 
            align-items: center; 
            margin-bottom: 8px; 
            font-weight: 900; 
            font-size: 2.2rem; 
            color: var(--primary); 
            line-height: 1; 
        }
        .main-frac .bar { 
            width: 34px; /* زيادة العرض */
            height: 4px; /* زيادة السمك */
            background: var(--primary); 
            margin: 5px 0; 
            border-radius: 2.5px; 
        }

        /* تنسيق كسر النصف الرأسي المضمون مع زيادة الحجم */
        .frac-solid {
            display: inline-block;
            text-align: center;
            vertical-align: middle;
            font-weight: 900 !important;
            opacity: 1 !important;
            line-height: 1.1;
        }
        .frac-solid .num {
            display: block;
            width: 100%;
        }
        .frac-solid .bar {
            display: block;
            width: 100%;
            height: 2.5px; /* زيادة سمك خط الكسر الداخلي */
            margin: 2px 0;
            border-radius: 1px;
        }
        .frac-solid .den {
            display: block;
            width: 100%;
        }

        /* كسر النصف الصغير للبطاقة أسفل الخط بعد التكبير */
        .frac-label { font-size: 0.97rem; color: #000000; width: 12px; }
        .frac-label .bar { background-color: #000000; height: 1.6px; }

        /* كسر النصف الصغير للأزرار التفاعلية بعد التكبير */
        .frac-btn { font-size: 1.3rem; color: #ffffff !important; width: 20px; }
        .frac-btn .bar { background-color: #ffffff !important; height: 2.5px; }

        /* تعديل خط الأعداد ليتناسب مع الحجم الجديد */
        .track-wrapper { margin: 20px 0; position: relative; direction: ltr; }
        .track { height: 10px; background: #cbd5e1; border-radius: 5px; width: 100%; cursor: pointer; }
        
        /* تكبير المؤشرات الدائرية والهدف بنسبة 10% إضافية */
        .marker { 
            position: absolute; 
            top: -7px; 
            width: 24px; /* تكبير القطر */
            height: 24px; 
            background: var(--accent); 
            border-radius: 50%; 
            transform: translateX(-50%); 
            box-shadow: 0 3px 5px rgba(0,0,0,0.15); 
            pointer-events: none; 
        }
        
        .exact-marker { 
            position: absolute; 
            top: -12px; 
            width: 2.5px; 
            height: 34px; /* زيادة الارتفاع */
            background: var(--success); 
            transform: translateX(-50%); 
            border-radius: 1px; 
            pointer-events: none; 
            transition: 0.3s; 
        }
        .exact-marker::after { 
            content: "📍"; 
            position: absolute; 
            top: -15px; 
            left: 50%; 
            transform: translateX(-50%); 
            font-size: 1.05rem; /* تكبير حجم الإيموجي */
        }

        /* تكبير ملصقات العناوين أسفل الخط */
        .labels { 
            display: flex; 
            justify-content: space-between; 
            margin-top: 8px; 
            font-weight: 900; 
            font-size: 1.15rem; /* تكبير حجم الخط */
            color: #000000; 
            align-items: center; 
        }

        /* تكبير الأزرار لتلائم الحجم الجديد وتسهل الضغط */
        .bench-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 13px; }
        button { 
            padding: 10px; 
            border: none; 
            border-radius: 0.8rem; 
            background: var(--primary); 
            color: #ffffff; 
            font-weight: 900; 
            font-size: 1.3rem; /* تكبير خط أزرار الخيارات */
            cursor: pointer; 
            transition: 0.2s; 
            min-height: 53px; /* زيادة الارتفاع الأدنى */
            display: flex; 
            justify-content: center; 
            align-items: center; 
            opacity: 1 !important; 
        }
        button:hover { background: #0369a1; transform: scale(1.02); }
        #next-btn { margin-top: 13px; width: 100%; background: var(--success); padding: 12px; min-height: 53px; }

        /* تكبير نصوص الإرشادات */
        h2 { font-size: 1.38rem; margin: 0 0 7px 0; }
        p { font-size: 1.05rem !important; margin: 6px 0 !important; }

        #feedback { font-size: 1.15rem; font-weight: bold; margin-top: 13px; min-height: 30px; }
    </style>
</head>
<body>

    <div class="main-card">
        <h2 style="color: var(--primary);">🎯 حدد الكسر على الخط</h2>
        
        <!-- Main Fraction -->
        <div id="fraction-display" class="main-frac">
            <span id="num">1</span>
            <div class="bar"></div>
            <span id="den">4</span>
        </div>

        <p style="font-weight: bold;">أين يقع هذا الكسر تقريباً؟ اضغط على خط الأعداد</p>

        <!-- Number Line (Forced LTR to maintain 0-left to 1-right) -->
        <div class="track-wrapper" dir="ltr">
            <div class="track" id="line-track" onclick="handleLineClick(event)"></div>
            <!-- Guess Marker -->
            <div id="marker" class="marker" style="display: none;"></div>
            <!-- Ideal Exact Target Marker -->
            <div id="exact-marker" class="exact-marker" style="display: none;"></div>
            
            <div class="labels">
                <span>0</span>
                <!-- Solid Vertical Fraction for 1/2 label -->
                <div class="frac-solid frac-label">
                    <span class="num">1</span>
                    <span class="bar"></span>
                    <span class="den">2</span>
                </div>
                <span>1</span>
            </div>
        </div>

        <!-- Benchmark Selection Section -->
        <div id="benchmark-step" style="display: none;">
            <p style="font-weight: bold;">إلى أي كسر مرجعي أقرب؟</p>
            <div class="bench-grid">
                <button onclick="checkBenchmark(0)">0</button>
                <button onclick="checkBenchmark(0.5)">
                    <!-- Solid Vertical Fraction for button -->
                    <div class="frac-solid frac-btn">
                        <span class="num">1</span>
                        <span class="bar"></span>
                        <span class="den">2</span>
                    </div>
                </button>
                <button onclick="checkBenchmark(1)">1</button>
            </div>
        </div>

        <div id="feedback"></div>
        <button id="next-btn" style="display: none;" onclick="newProblem()">كسر جديد 🔄</button>
    </div>

    <script>
        let currentN, currentD;
        let isPositionAccepted = false;

        // Reset game with new numbers
        function newProblem() {
            currentD = [3, 4, 5, 6, 8, 10][Math.floor(Math.random() * 6)];
            currentN = Math.floor(Math.random() * (currentD - 1)) + 1;
            isPositionAccepted = false;
            
            document.getElementById('num').innerText = currentN;
            document.getElementById('den').innerText = currentD;
            
            document.getElementById('marker').style.display = 'none';
            document.getElementById('exact-marker').style.display = 'none';
            document.getElementById('benchmark-step').style.display = 'none';
            document.getElementById('feedback').innerText = "";
            document.getElementById('next-btn').style.display = 'none';
        }

        /* Validate click accuracy on the number line with visual guidance */
        function handleLineClick(e) {
            const track = document.getElementById('line-track');
            const marker = document.getElementById('marker');
            const exactMarker = document.getElementById('exact-marker');
            const rect = track.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const percentage = (x / rect.width) * 100;
            
            // Safe boundaries
            const safePercentage = Math.max(0, Math.min(100, percentage));
            
            // Visual Update
            marker.style.left = safePercentage + '%';
            marker.style.display = 'block';

            // Pedagogical estimation check (15% tolerance)
            const actualVal = currentN / currentD;
            const actualPercentage = actualVal * 100;
            const diff = Math.abs(safePercentage - actualPercentage);
            const tolerance = 15; 

            const feedback = document.getElementById('feedback');

            if (diff <= tolerance) {
            isPositionAccepted = true;
            feedback.innerText = "رائع! تقدير متميز ومقارب جداً لموقع الكسر 🎯";
            feedback.style.color = "var(--success)";
            
            // Show exact position helper pin
            exactMarker.style.left = actualPercentage + '%';
            exactMarker.style.display = 'block';
            
            // Reveal benchmark choices
            document.getElementById('benchmark-step').style.display = 'block';
        } else {
            isPositionAccepted = false;
            feedback.innerText = "الموضع غير دقيق تماماً، حاول الضغط على مكان أقرب للكسر 🔍";
            feedback.style.color = "var(--accent)";
            document.getElementById('benchmark-step').style.display = 'none';
            exactMarker.style.display = 'none';
        }
    }

    /* Get the official curriculum benchmark standard based on school textbooks */
    function getCorrectBenchmark(n, d) {
        if (d === 3) {
            if (n === 1) return 0.5;  // 1/3 rounds to 1/2
            if (n === 2) return 1;    // 2/3 rounds to 1 (Curriculum Standard)
        }
        if (d === 4) {
            if (n === 1) return 0;    // 1/4 rounds to 0
            if (n === 2) return 0.5;  // 2/4 rounds to 1/2
            if (n === 3) return 1;    // 3/4 rounds to 1
        }
        if (d === 5) {
            if (n === 1) return 0;
            if (n === 2) return 0.5;  // 2/5 rounds to 1/2
            return 1;                 // 3/5 and 4/5 round to 1 (Curriculum Standard)
        }
        if (d === 6) {
            if (n === 1) return 0;
            if (n === 2 || n === 3) return 0.5; // 2/6 (1/3) -> 1/2, 3/6 -> 1/2
            if (n >= 4) return 1;     // 4/6 (2/3) -> 1, 5/6 -> 1
        }
        if (d === 8) {
            if (n <= 2) return 0;     // 1/8, 2/8 (1/4) round to 0
            if (n <= 5) return 0.5;   // 3/8, 4/8, 5/8 round to 1/2
            return 1;                 // 6/8, 7/8 round to 1
        }
        if (d === 10) {
            if (n <= 2) return 0;     // 1/10, 2/10 round to 0
            if (n <= 6) return 0.5;   // 3/10 to 6/10 round to 1/2
            return 1;                 // 7/10, 8/10, 9/10 round to 1
        }
        // Fallback mathematical logic if any other denominator occurs
        const val = n / d;
        if (val < 0.25) return 0;
        if (val <= 0.75) return 0.5;
        return 1;
    }

    /* Verify chosen benchmark fraction using absolute distance calculation */
    function checkBenchmark(val) {
        if (!isPositionAccepted) return;

        const correctBenchmark = getCorrectBenchmark(currentN, currentD);
        const correct = (val === correctBenchmark);

        const feedback = document.getElementById('feedback');
        if (correct) {
            feedback.innerHTML = "أحسنت! الإجابة والتقدير صحيحة وممتازة 🌟👏";
            feedback.style.color = "var(--success)";
            document.getElementById('next-btn').style.display = 'block';
        } else {
            feedback.innerText = "التقدير للموقع رائع، ولكن فكر مجدداً في الكسر المرجعي الأقرب 🤔";
            feedback.style.color = "var(--accent)";
        }
    }

    // Initialize first problem on load
    newProblem();
</script>
</body>
</html>
