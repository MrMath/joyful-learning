<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سباق الكسور المرجعية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background: #e0f2fe; }
        
        /* تصميم الكسر الصلب المضمون */
        .frac-block {
            display: inline-block;
            vertical-align: middle;
            text-align: center;
            line-height: 1;
        }
        .frac-n { display: block; border-bottom: 2px solid currentColor; padding: 0 4px; }
        .frac-d { display: block; padding: 0 4px; }
        
        .car-move { transition: right 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    </style>
</head>
<body class="p-2 flex flex-col items-center justify-center min-h-screen">

    <div class="w-full max-w-sm bg-white rounded-3xl shadow-xl p-4 border-4 border-sky-200">
        <h1 class="text-xl text-center text-sky-700 mb-3 font-black">🏎️ سباق الكسور المرجعية</h1>
        
        <!-- مسار السباق -->
        <div class="bg-sky-50 rounded-2xl p-2 mb-3 border-2 border-sky-100">
            <div class="relative h-10 border-b-4 border-dashed border-sky-200 mb-1">
                <div id="p-car" class="car-move absolute right-0 text-2xl">🏎️</div>
            </div>
            <div class="relative h-10">
                <div id="r-car" class="car-move absolute right-0 text-2xl">⚡</div>
            </div>
        </div>

        <!-- منطقة التعزيز -->
        <div id="combo-msg" class="h-8 flex items-center justify-center text-base font-bold text-orange-500 transition-all duration-300 opacity-0 transform scale-0">
        </div>

        <!-- الكسر المطلوب -->
        <div class="flex flex-col items-center justify-center my-2">
            <div class="bg-sky-100 px-4 py-2 rounded-2xl border-4 border-sky-300 text-center shadow-inner">
                <div id="num-val" class="text-3xl font-black text-sky-800">1</div>
                <div class="w-10 h-1 bg-sky-800 rounded-full my-0.5 mx-auto"></div>
                <div id="den-val" class="text-3xl font-black text-sky-800">8</div>
            </div>
        </div>

        <!-- بوابات الاختيار (تم إجبار الاتجاه على ltr لضمان 0 يسار و 1 يمين) -->
        <div dir="ltr" class="grid grid-cols-3 gap-2 mt-3">
            <button class="bg-green-100 hover:bg-green-200 border-4 border-green-300 p-2 rounded-2xl text-xl font-black text-green-700 transition-transform active:scale-95" onclick="submitAnswer(0)">
                0
            </button>
            <button class="bg-amber-100 hover:bg-amber-200 border-4 border-amber-300 p-2 rounded-2xl text-xl font-black text-amber-700 transition-transform active:scale-95" onclick="submitAnswer(0.5)">
                <div class="frac-block">
                    <span class="frac-n">1</span>
                    <span class="frac-d">2</span>
                </div>
            </button>
            <button class="bg-red-100 hover:bg-red-200 border-4 border-red-300 p-2 rounded-2xl text-xl font-black text-red-700 transition-transform active:scale-95" onclick="submitAnswer(1)">
                1
            </button>
        </div>
        
        <div class="text-center mt-3 text-sm font-bold text-gray-500">النقاط: <span id="score" class="text-sky-600">0</span></div>
    </div>

    <script>
        let score = 0, streak = 0, currentAnswer;
        const pCar = document.getElementById('p-car');
        const rCar = document.getElementById('r-car');

        function getCorrectBenchmark(n, d) {
            const val = n / d;
            // منطق التقريب التعليمي الرسمي
            if (d === 3) return n === 1 ? 0.5 : 1;
            if (d === 4) return n === 1 ? 0 : (n === 2 ? 0.5 : 1);
            if (d === 5) return n <= 1 ? 0 : (n === 2 ? 0.5 : 1);
            if (d === 6) return n <= 1 ? 0 : (n <= 3 ? 0.5 : 1);
            if (d === 8) return n <= 2 ? 0 : (n <= 5 ? 0.5 : 1);
            if (d === 10) return n <= 2 ? 0 : (n <= 6 ? 0.5 : 1);
            return val < 0.25 ? 0 : (val <= 0.75 ? 0.5 : 1);
        }

        function nextRound() {
            const denominators = [3, 4, 5, 6, 8, 10];
            const d = denominators[Math.floor(Math.random() * denominators.length)];
            const n = Math.floor(Math.random() * (d - 1)) + 1;
            
            currentAnswer = getCorrectBenchmark(n, d);
            
            document.getElementById('num-val').innerText = n;
            document.getElementById('den-val').innerText = d;
            
            pCar.style.right = (streak * 20) + '%';
            rCar.style.right = '0%';
            setTimeout(() => rCar.style.right = '80%', 100); 
        }

        function submitAnswer(val) {
            const msg = document.getElementById('combo-msg');
            if(val === currentAnswer) {
                score += 10;
                streak++;
                document.getElementById('score').innerText = score;
                pCar.style.right = (streak * 20) + '%';
                
                if(streak >= 4) {
                    triggerReward();
                } else {
                    nextRound();
                }
            } else {
                streak = 0;
                msg.innerText = "حاول مجدداً! ❌";
                msg.classList.add('opacity-100', 'scale-100');
                msg.classList.remove('opacity-0', 'scale-0');
                setTimeout(() => msg.classList.add('opacity-0', 'scale-0'), 800);
            }
        }

        function triggerReward() {
            const msg = document.getElementById('combo-msg');
            msg.innerText = "🚀 نيترو تعزيز! 🚀";
            msg.classList.add('opacity-100', 'scale-110');
            msg.classList.remove('opacity-0', 'scale-0');
            
            pCar.style.right = '85%'; 
            
            setTimeout(() => {
                msg.classList.add('opacity-0', 'scale-0');
                streak = 0;
                nextRound();
            }, 1500);
        }

        nextRound();
    </script>
</body>
</html>
