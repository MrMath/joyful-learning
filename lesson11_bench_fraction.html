<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سباق الكسور المرجعية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background: #e0f2fe; }
        .v-frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.1; }
        .v-n { border-bottom: 3px solid currentColor; padding: 0 4px; }
        .v-d { padding: 0 4px; }
        .car-move { transition: right 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    </style>
</head>
<body class="p-2 md:p-4 flex flex-col items-center justify-center min-h-screen">

    <div class="w-full max-w-2xl bg-white rounded-3xl shadow-2xl p-4 md:p-8 border-4 border-sky-200">
        <h1 class="text-2xl md:text-4xl text-center text-sky-700 mb-4 font-black">🏎️ سباق الكسور المرجعية</h1>
        
        <!-- مسار السباق - تقليل المسافات هنا -->
        <div class="bg-sky-50 rounded-2xl p-3 mb-4 border-2 border-sky-100">
            <div class="relative h-16 border-b-4 border-dashed border-sky-200 mb-2">
                <div id="p-car" class="car-move absolute right-0 text-4xl">🏎️</div>
            </div>
            <div class="relative h-16">
                <div id="r-car" class="car-move absolute right-0 text-4xl">⚡</div>
            </div>
        </div>

        <!-- منطقة التعزيز -->
        <div id="combo-msg" class="h-12 flex items-center justify-center text-xl font-bold text-orange-500 transition-all duration-300 opacity-0 transform scale-0">
        </div>

        <!-- الكسر المطلوب -->
        <div class="flex flex-col items-center justify-center my-2">
            <div class="bg-sky-100 px-8 py-4 rounded-3xl border-4 border-sky-300 text-center shadow-inner">
                <div id="num-val" class="text-5xl font-black text-sky-800">1</div>
                <div class="w-16 h-1.5 bg-sky-800 rounded-full my-1"></div>
                <div id="den-val" class="text-5xl font-black text-sky-800">8</div>
            </div>
        </div>

        <!-- بوابات الاختيار -->
        <div class="grid grid-cols-3 gap-3 mt-4">
            <button class="bg-green-100 hover:bg-green-200 border-4 border-green-300 p-4 rounded-3xl text-3xl font-black text-green-700 transition-transform active:scale-95" onclick="submitAnswer(0)">
                0
            </button>
            <button class="bg-amber-100 hover:bg-amber-200 border-4 border-amber-300 p-4 rounded-3xl text-3xl font-black text-amber-700 transition-transform active:scale-95" onclick="submitAnswer(0.5)">
                <div class="v-frac">
                    <span class="v-n">1</span>
                    <span class="v-d">2</span>
                </div>
            </button>
            <button class="bg-red-100 hover:bg-red-200 border-4 border-red-300 p-4 rounded-3xl text-3xl font-black text-red-700 transition-transform active:scale-95" onclick="submitAnswer(1)">
                1
            </button>
        </div>
        
        <div class="text-center mt-4 text-lg font-bold text-gray-500">النقاط: <span id="score" class="text-sky-600">0</span></div>
    </div>

    <script>
        let score = 0, streak = 0, currentAnswer;
        const pCar = document.getElementById('p-car');
        const rCar = document.getElementById('r-car');

        function nextRound() {
            const cats = [0, 0.5, 1];
            currentAnswer = cats[Math.floor(Math.random()*3)];
            
            let n, d;
            if(currentAnswer === 0) { d = Math.floor(Math.random()*5)+8; n = 1; }
            else if(currentAnswer === 0.5) { d = Math.floor(Math.random()*5)+6; n = Math.floor(d/2); }
            else { d = Math.floor(Math.random()*5)+8; n = d-1; }

            document.getElementById('num-val').innerText = n;
            document.getElementById('den-val').innerText = d;
            
            pCar.style.right = '0%';
            rCar.style.right = '0%';
            setTimeout(() => rCar.style.right = '80%', 100); 
        }

        function submitAnswer(val) {
            const msg = document.getElementById('combo-msg');
            if(val === currentAnswer) {
                score += 10;
                streak++;
                document.getElementById('score').innerText = score;
                pCar.style.right = (parseInt(pCar.style.right) || 0) + 20 + '%';
                
                if(streak === 3) {
                    triggerReward();
                } else {
                    setTimeout(nextRound, 600);
                }
            } else {
                streak = 0;
                msg.innerText = "حاول مجدداً! ❌";
                msg.classList.add('opacity-100', 'scale-100');
                msg.classList.remove('opacity-0', 'scale-0');
                setTimeout(() => msg.classList.add('opacity-0', 'scale-0'), 800);
            }
        }

        function triggerReward() {
            const msg = document.getElementById('combo-msg');
            msg.innerText = "🚀 نيترو تعزيز! 🚀";
            msg.classList.add('opacity-100', 'scale-110');
            msg.classList.remove('opacity-0', 'scale-0');
            
            pCar.style.right = '90%'; 
            
            setTimeout(() => {
                msg.classList.add('opacity-0', 'scale-0');
                streak = 0;
                nextRound();
            }, 1500);
        }

        nextRound();
    </script>
</body>
</html>
