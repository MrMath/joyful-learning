<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستكشف الكسور التفاعلي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f0f9ff; }
        .shape-element { transition: all 0.3s ease; cursor: pointer; stroke: #0369a1; stroke-width: 2; }
        .shape-element:hover { opacity: 0.8; transform: scale(1.01); }
        .shaded { fill: #f59e0b !important; }
        .unshaded { fill: #ffffff !important; }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center justify-center">

    <div class="w-full max-w-2xl bg-white rounded-3xl shadow-2xl p-6 border-4 border-sky-100">
        <h1 class="text-3xl font-black text-sky-800 text-center mb-6">🍕 مستكشف الكسور</h1>

        <!-- أدوات التحكم -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div class="flex flex-col gap-2">
                <label class="font-bold text-gray-600">اختر الشكل:</label>
                <select id="shapeSelect" class="p-3 rounded-xl border-2 border-sky-200 bg-sky-50 font-bold text-sky-900 focus:outline-none focus:border-sky-500" onchange="updateView()">
                    <option value="circle">بيتزا (دائرة)</option>
                    <option value="rectangle">شوكولاتة (مستطيل)</option>
                </select>
            </div>
            <div class="flex flex-col gap-2">
                <label class="font-bold text-gray-600">عدد التقسيمات: <span id="divCount" class="text-sky-600">4</span></label>
                <input type="range" id="divSlider" min="2" max="12" value="4" class="w-full h-4 bg-sky-100 rounded-lg appearance-none cursor-pointer" oninput="updateView()">
            </div>
        </div>

        <!-- مساحة الرسم -->
        <div id="canvas-container" class="flex flex-col justify-center items-center bg-sky-50 rounded-2xl border-2 border-dashed border-sky-200 p-4 mb-4">
            <svg id="canvas" width="300" height="300" viewBox="0 0 400 400" class="mb-4"></svg>
            
            <!-- إضافة عرض الكسر -->
            <div id="fractionDisplay" class="text-3xl font-black text-sky-800 bg-white px-6 py-2 rounded-full border-4 border-sky-200 shadow-lg">
                0/4
            </div>
        </div>

        <!-- الملاحظات الذكية -->
        <div id="note" class="p-4 bg-amber-50 rounded-xl border-2 border-amber-200 text-center font-bold text-amber-800">
            الواحد الصحيح هو الشكل الكامل قبل أن نأخذ منه أي جزء.
        </div>

        <button onclick="reset()" class="w-full mt-4 py-3 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-xl transition-all">إعادة ضبط</button>
    </div>

    <script>
        let divisions = 4;
        let shape = 'circle';
        let shadedParts = [];

        function updateView() {
            divisions = parseInt(document.getElementById('divSlider').value);
            shape = document.getElementById('shapeSelect').value;
            document.getElementById('divCount').innerText = divisions;
            shadedParts = []; 
            render();
        }

        function togglePart(index) {
            if (shadedParts.includes(index)) {
                shadedParts = shadedParts.filter(i => i !== index);
            } else {
                shadedParts.push(index);
            }
            render();
        }

        function reset() {
            document.getElementById('divSlider').value = 4;
            document.getElementById('shapeSelect').value = 'circle';
            updateView();
        }

        function render() {
            const svg = document.getElementById('canvas');
            const fracDisp = document.getElementById('fractionDisplay');
            svg.innerHTML = '';
            
            // 1. حساب وعرض الكسر
            const numerator = shadedParts.length;
            const denominator = divisions;
            if (numerator === denominator && denominator > 0) {
                fracDisp.innerText = `${numerator}/${denominator} = 1`;
                fracDisp.className = "text-3xl font-black text-emerald-600 bg-emerald-50 px-6 py-2 rounded-full border-4 border-emerald-200 shadow-lg";
            } else {
                fracDisp.innerText = `${numerator}/${denominator}`;
                fracDisp.className = "text-3xl font-black text-sky-800 bg-white px-6 py-2 rounded-full border-4 border-sky-200 shadow-lg";
            }
            
            // 2. تحديث الملاحظة
            const note = document.getElementById('note');
            if (divisions >= 8) note.innerText = "لاحظ كيف أصبحت الأجزاء صغيرة جداً!";
            else if (numerator === denominator && denominator > 0) note.innerText = "رائع! لقد لونت كل الأجزاء.. هذا يساوي 1 صحيح كامل!";
            else note.innerText = "اضغط على الأجزاء لتلوينها واكتشاف الكسور.";

            // 3. رسم الشكل
            if (shape === 'circle') {
                for (let i = 0; i < divisions; i++) {
                    const angle = (2 * Math.PI) / divisions;
                    const startAngle = i * angle;
                    const endAngle = (i + 1) * angle;
                    
                    const x1 = 200 + 150 * Math.cos(startAngle);
                    const y1 = 200 + 150 * Math.sin(startAngle);
                    const x2 = 200 + 150 * Math.cos(endAngle);
                    const y2 = 200 + 150 * Math.sin(endAngle);
                    
                    const pathData = `M 200 200 L ${x1} ${y1} A 150 150 0 0 1 ${x2} ${y2} Z`;
                    
                    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                    path.setAttribute("d", pathData);
                    path.setAttribute("class", `shape-element ${shadedParts.includes(i) ? 'shaded' : 'unshaded'}`);
                    path.onclick = () => togglePart(i);
                    svg.appendChild(path);
                }
            } else {
                const rectWidth = 300;
                const rectHeight = 150;
                const segmentWidth = rectWidth / divisions;
                
                for (let i = 0; i < divisions; i++) {
                    const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                    rect.setAttribute("x", 50 + (i * segmentWidth));
                    rect.setAttribute("y", 125);
                    rect.setAttribute("width", segmentWidth);
                    rect.setAttribute("height", rectHeight);
                    rect.setAttribute("class", `shape-element ${shadedParts.includes(i) ? 'shaded' : 'unshaded'}`);
                    rect.onclick = () => togglePart(i);
                    svg.appendChild(rect);
                }
            }
        }

        updateView();
    </script>
</body>
</html>
