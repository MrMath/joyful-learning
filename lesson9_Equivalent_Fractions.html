<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مختبر الكسور المتكافئة التفاعلي</title>
    <!-- استدعاء Tailwind CSS وخط تجول لتجربة بصرية حديثة وجميلة -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }
    </style>
</head>
<body class="min-h-screen bg-sky-50 font-sans p-4 md:p-8 flex flex-col items-center text-right select-none relative overflow-x-hidden">

    <!-- عناصر خلفية جمالية عائمة مع تأثيرات حركية خفيفة -->
    <div class="fixed top-10 left-10 text-yellow-300 opacity-40 animate-bounce pointer-events-none">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    </div>
    <div class="fixed bottom-10 right-10 text-pink-300 opacity-40 animate-pulse pointer-events-none">
        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    </div>
    <div class="fixed top-1/2 right-4 text-green-300 opacity-30 pointer-events-none">
        <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>
    </div>

    <!-- الهيدر الرئيسي للتطبيق -->
    <header class="mb-8 text-center z-10">
        <h1 class="text-4xl md:text-6xl font-black text-blue-600 mb-2 drop-shadow-sm">الكسور المتكافئة</h1>
        <p class="text-xl text-blue-400 font-medium italic">اكتشف الكسور المتساوية بنفسك!</p>
    </header>

    <!-- أزرار اختيار وضع العرض (شرائح مستطيلة أو دوائر) -->
    <div class="flex gap-4 mb-10 z-10">
        <button id="btn-mode-strips" onclick="toggleMode('strips')" class="flex items-center gap-2 px-6 py-3 rounded-2xl font-bold text-lg transition-all bg-orange-500 text-white shadow-lg scale-105">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/></svg>
            تقسيم الشرائح
        </button>
        <button id="btn-mode-circles" onclick="toggleMode('circles')" class="flex items-center gap-2 px-6 py-3 rounded-2xl font-bold text-lg transition-all bg-white text-gray-500 hover:bg-gray-100">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/><path d="M2 12h20"/></svg>
            تقسيم الدوائر
        </button>
    </div>

    <!-- منطقة التفاعل والعمل الرئيسية -->
    <main class="bg-white/80 backdrop-blur-md p-6 md:p-12 rounded-[3rem] shadow-2xl w-full max-w-4xl border-8 border-white relative">
        
        <!-- شبكة عرض الكسرين المتجاورين -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-16 items-center relative">
            
            <!-- الكسر الأول (مرجعي / تفاعلي) -->
            <div class="flex flex-col items-center gap-6">
                <h3 class="text-2xl font-bold text-blue-500">الكسر الأول</h3>
                
                <!-- أزرار التحكم بتقسيمات الكسر الأول -->
                <div class="flex items-center gap-4">
                    <button onclick="changeDivisions(1, -1)" class="p-2 bg-blue-100 rounded-full text-blue-600 hover:bg-blue-200 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    </button>
                    <div id="div-display-1" class="text-3xl font-bold w-12 text-center text-blue-700">2</div>
                    <button onclick="changeDivisions(1, 1)" class="p-2 bg-blue-100 rounded-full text-blue-600 hover:bg-blue-200 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    </button>
                </div>

                <!-- مساحة رسم الأشكال الهندسية التفاعلية للكسر الأول -->
                <div id="visualizer-1" class="py-4 min-h-[220px] flex items-center justify-center">
                    <!-- سيتم توليده ديناميكياً بواسطة الجافاسكربت -->
                </div>

                <!-- التمثيل الرياضي الرأسي للكسر الأول -->
                <div class="flex flex-col items-center bg-blue-50 px-6 py-4 rounded-2xl border-2 border-blue-200 min-w-[100px]">
                    <span id="math-num-1" class="text-3xl font-black text-blue-600">1</span>
                    <div class="w-12 h-1 bg-blue-600 my-1 rounded-full"></div>
                    <span id="math-den-1" class="text-3xl font-black text-blue-600">2</span>
                </div>
            </div>

            <!-- الكسر الثاني (التفاعلي) -->
            <div class="flex flex-col items-center gap-6">
                <h3 class="text-2xl font-bold text-orange-500">الكسر الثاني</h3>
                
                <!-- أزرار التحكم بتقسيمات الكسر الثاني -->
                <div class="flex items-center gap-4">
                    <button onclick="changeDivisions(2, -1)" class="p-2 bg-orange-100 rounded-full text-orange-600 hover:bg-orange-200 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    </button>
                    <div id="div-display-2" class="text-3xl font-bold w-12 text-center text-orange-700">4</div>
                    <button onclick="changeDivisions(2, 1)" class="p-2 bg-orange-100 rounded-full text-orange-600 hover:bg-orange-200 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    </button>
                </div>

                <!-- مساحة رسم الأشكال الهندسية التفاعلية للكسر الثاني -->
                <div id="visualizer-2" class="py-4 min-h-[220px] flex items-center justify-center">
                    <!-- سيتم توليده ديناميكياً بواسطة الجافاسكربت -->
                </div>

                <!-- التمثيل الرياضي الرأسي للكسر الثاني -->
                <div class="flex flex-col items-center bg-orange-50 px-6 py-4 rounded-2xl border-2 border-orange-200 min-w-[100px]">
                    <span id="math-num-2" class="text-3xl font-black text-orange-600">0</span>
                    <div class="w-12 h-1 bg-orange-600 my-1 rounded-full"></div>
                    <span id="math-den-2" class="text-3xl font-black text-orange-600">4</span>
                </div>
            </div>

            <!-- خط الإرشاد الرأسي العمودي للشرائح في وضع المستطيلات -->
            <div id="vertical-guide" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[1px] h-[70%] border-l-2 border-dashed border-gray-300 pointer-events-none hidden md:block"></div>
        </div>

        <!-- قسم التغذية الراجعة المركزية المطور -->
        <div id="feedback-center" class="mt-10 flex justify-center items-center min-h-[80px] transition-all duration-300">
            <!-- سيتم تحديث التغذية الراجعة التفاعلية هنا ديناميكياً -->
        </div>

        <!-- مؤشر المساواة والرياضيات العام بالأسفل -->
        <div class="mt-8 text-center">
            <div id="identity-box" class="inline-flex items-center gap-6 text-4xl font-black p-5 rounded-3xl transition-all bg-gray-100 opacity-40">
                <div class="flex flex-col items-center">
                    <span id="footer-num-1">1</span>
                    <div class="w-8 h-1 bg-current"></div>
                    <span id="footer-den-1">2</span>
                </div>
                <span id="footer-sign" class="text-5xl">≠</span>
                <div class="flex flex-col items-center">
                    <span id="footer-num-2">0</span>
                    <div class="w-8 h-1 bg-current"></div>
                    <span id="footer-den-2">4</span>
                </div>
            </div>
        </div>
    </main>

    <!-- زر البدء من جديد لتصفير تظليل الأجزاء -->
    <button onclick="reset()" class="mt-8 flex items-center gap-2 px-8 py-3 bg-gray-700 hover:bg-gray-800 text-white font-bold rounded-full transition-colors shadow-lg">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
        ابدأ من جديد
    </button>

    <footer class="mt-12 text-gray-500 text-sm font-medium">
        اضغط على الأجزاء لتظليلها | غيّر عدد التقسيمات باستخدام أزرار + و -
    </footer>

    <script>
        // إعدادات الحالة الأساسية مطابقة تماماً لمكون الـ React
        let state = {
            mode: 'strips', // 'strips' أو 'circles'
            div1: 2,
            shaded1: 1,
            div2: 4,
            shaded2: 0,
            isEquivalent: false
        };

        // دالة التهيئة الأولية للتطبيق عند تشغيل الصفحة
        window.onload = function() {
            render();
        };

        // تبديل أوضاع العرض (الشرائح المستطيلة أو الدوائر)
        function toggleMode(newMode) {
            state.mode = newMode;
            
            // تحديث تصميم الأزرار النشطة وغير النشطة بصرياً
            const btnStrips = document.getElementById('btn-mode-strips');
            const btnCircles = document.getElementById('btn-mode-circles');
            
            if (newMode === 'strips') {
                btnStrips.className = "flex items-center gap-2 px-6 py-3 rounded-2xl font-bold text-lg transition-all bg-orange-500 text-white shadow-lg scale-105";
                btnCircles.className = "flex items-center gap-2 px-6 py-3 rounded-2xl font-bold text-lg transition-all bg-white text-gray-500 hover:bg-gray-100";
                document.getElementById('vertical-guide').classList.remove('hidden');
            } else {
                btnCircles.className = "flex items-center gap-2 px-6 py-3 rounded-2xl font-bold text-lg transition-all bg-purple-600 text-white shadow-lg scale-105";
                btnStrips.className = "flex items-center gap-2 px-6 py-3 rounded-2xl font-bold text-lg transition-all bg-white text-gray-500 hover:bg-gray-100";
                document.getElementById('vertical-guide').classList.add('hidden');
            }
            
            reset();
        }

        // تصفير التظليل للأجزاء
        function reset() {
            state.shaded1 = 1;
            state.shaded2 = 0;
            state.isEquivalent = false;
            render();
        }

        // التحكم في عدد التقسيمات (البسط / المقام) بين 1 و 20
        function changeDivisions(shapeNum, delta) {
            if (shapeNum === 1) {
                state.div1 = Math.max(1, Math.min(20, state.div1 + delta));
                // ضبط التظليل كي لا يزيد عن التقسيمات الجديدة
                if (state.shaded1 > state.div1) state.shaded1 = state.div1;
            } else {
                state.div2 = Math.max(1, Math.min(20, state.div2 + delta));
                if (state.shaded2 > state.div2) state.shaded2 = state.div2;
            }
            checkEquivalence();
            render();
        }

        // التقاط ضغطة المستخدم على أي قطعة هندسية لتظليلها حتى هذا الموضع
        function handleSegmentClick(shapeNum, index) {
            if (shapeNum === 1) {
                state.shaded1 = index + 1;
            } else {
                state.shaded2 = index + 1;
            }
            checkEquivalence();
            render();
        }

        // فحص حالة التكافؤ الرياضي بين الكسرين
        function checkEquivalence() {
            const frac1 = state.shaded1 / state.div1;
            const frac2 = state.shaded2 / state.div2;
            
            if (state.shaded1 > 0 && state.shaded2 > 0 && Math.abs(frac1 - frac2) < 0.0001) {
                state.isEquivalent = true;
            } else {
                state.isEquivalent = false;
            }
        }

        // دالة توليد شرائح مستطيلة (Strips) تفاعلية بالكامل
        function generateStripsSVG(id, divisions, shaded, color) {
            const width = 300;
            const height = 60;
            const segmentWidth = width / divisions;
            
            // محاكاة إطار التوهج الأصفر المضيء عند التكافؤ
            const borderClass = state.isEquivalent ? 'border-yellow-400 shadow-[0_0_15px_rgba(250,204,21,0.6)]' : 'border-gray-200';
            
            let svg = `<svg width="${width}" height="${height}" class="rounded-lg overflow-hidden border-4 ${borderClass} transition-all duration-300">`;
            
            for (let i = 0; i < divisions; i++) {
                const fill = i < shaded ? color : '#f3f4f6';
                svg += `
                    <rect 
                        x="${i * segmentWidth}" 
                        y="0" 
                        width="${segmentWidth}" 
                        height="${height}" 
                        fill="${fill}" 
                        stroke="#9ca3af" 
                        stroke-width="2" 
                        class="cursor-pointer hover:opacity-80" 
                        onclick="handleSegmentClick(${id}, ${i})"
                    />
                `;
            }
            
            svg += `</svg>`;
            return svg;
        }

        // دالة توليد دوائر مجزأة (Circles) دقيقة هندسياً
        function generateCirclesSVG(id, divisions, shaded, color) {
            const radius = 80;
            const cx = 100;
            const cy = 100;
            
            // تأثير التوهج المضيء للدائرة عند التكافؤ
            const glowClass = state.isEquivalent ? 'border-yellow-400 shadow-[0_0_20px_rgba(250,204,21,0.6)]' : 'border-transparent';
            
            let svg = `<svg width="200" height="200" class="rounded-full border-4 ${glowClass} transition-all duration-300">`;
            
            // إذا كانت التقسيمات تساوي 1، يتم رسم دائرة كاملة واحدة دون تقسيمات معقدة لمنع أخطاء التقسيم
            if (divisions === 1) {
                const fill = shaded >= 1 ? color : '#f3f4f6';
                svg += `
                    <circle 
                        cx="${cx}" 
                        cy="${cy}" 
                        r="${radius}" 
                        fill="${fill}" 
                        stroke="#9ca3af" 
                        stroke-width="2" 
                        class="cursor-pointer hover:opacity-80 transition-colors"
                        onclick="handleSegmentClick(${id}, 0)"
                    />
                `;
            } else {
                for (let i = 0; i < divisions; i++) {
                    const startAngle = (i * 360) / divisions;
                    const endAngle = ((i + 1) * 360) / divisions;
                    
                    // حساب الإحداثيات الهندسية على محيط الدائرة بزوايا دقيقة ومريحة تبدأ من الأعلى (90-)
                    const x1 = cx + radius * Math.cos((Math.PI * (startAngle - 90)) / 180);
                    const y1 = cy + radius * Math.sin((Math.PI * (startAngle - 90)) / 180);
                    const x2 = cx + radius * Math.cos((Math.PI * (endAngle - 90)) / 180);
                    const y2 = cy + radius * Math.sin((Math.PI * (endAngle - 90)) / 180);
                    
                    const largeArcFlag = 360 / divisions > 180 ? 1 : 0;
                    const d = `M ${cx} ${cy} L ${x1} ${y1} A ${radius} ${radius} 0 ${largeArcFlag} 1 ${x2} ${y2} Z`;
                    
                    const fill = i < shaded ? color : '#f3f4f6';
                    
                    svg += `
                        <path 
                            d="${d}" 
                            fill="${fill}" 
                            stroke="#9ca3af" 
                            stroke-width="2" 
                            class="cursor-pointer hover:opacity-80 transition-colors" 
                            onclick="handleSegmentClick(${id}, ${i})"
                        />
                    `;
                }
            }
            
            svg += `</svg>`;
            return svg;
        }

        // تحديث جميع عناصر الصفحة بناءً على الحالة الحالية
        function render() {
            // تحديث قيم التقسيم والكسور للوحة الأولى والثانية
            document.getElementById('div-display-1').innerText = state.div1;
            document.getElementById('div-display-2').innerText = state.div2;

            document.getElementById('math-num-1').innerText = state.shaded1;
            document.getElementById('math-den-1').innerText = state.div1;
            document.getElementById('math-num-2').innerText = state.shaded2;
            document.getElementById('math-den-2').innerText = state.div2;

            // تحديث الأرقام والرموز في شريط التطابق بالأسفل
            document.getElementById('footer-num-1').innerText = state.shaded1;
            document.getElementById('footer-den-1').innerText = state.div1;
            document.getElementById('footer-num-2').innerText = state.shaded2;
            document.getElementById('footer-den-2').innerText = state.div2;

            // تحديث الهيئة الهندسية حسب وضع العرض النشط
            const visualizer1 = document.getElementById('visualizer-1');
            const visualizer2 = document.getElementById('visualizer-2');
            
            if (state.mode === 'strips') {
                visualizer1.innerHTML = generateStripsSVG(1, state.div1, state.shaded1, '#3b82f6');
                visualizer2.innerHTML = generateStripsSVG(2, state.div2, state.shaded2, '#f97316');
            } else {
                visualizer1.innerHTML = generateCirclesSVG(1, state.div1, state.shaded1, '#3b82f6');
                visualizer2.innerHTML = generateCirclesSVG(2, state.div2, state.shaded2, '#f97316');
            }

            // التحكم في ظهور وتحديث محتوى التغذية الراجعة المركزية
            const feedbackCenter = document.getElementById('feedback-center');
            const identityBox = document.getElementById('identity-box');
            const footerSign = document.getElementById('footer-sign');

            if (state.isEquivalent) {
                // حالة التكافؤ: تغذية راجعة احتفالية مميزة
                feedbackCenter.innerHTML = `
                    <div class="bg-emerald-500 text-white px-8 py-4 rounded-3xl font-black text-2xl animate-bounce shadow-xl flex items-center gap-3 border-4 border-emerald-300">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="text-white"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                        <span>رائع جداً! الكسران متكافئان! 🎉</span>
                    </div>
                `;
                identityBox.className = "inline-flex items-center gap-6 text-4xl font-black p-5 rounded-3xl transition-all bg-yellow-100 text-blue-900 scale-110 shadow-lg border-2 border-yellow-300 animate-pulse";
                footerSign.innerText = "=";
            } else {
                // حالة عدم التكافؤ: تغذية راجعة توجيهية هادفة تحث الطالب على المحاولة
                feedbackCenter.innerHTML = `
                    <div class="bg-blue-50/75 text-blue-600 px-6 py-3 rounded-2xl font-bold text-lg border border-blue-100/50 flex items-center gap-2 shadow-sm">
                        <span>💡 جرب تظليل مساحات متطابقة في كلا الشكلين لملاحظة التكافؤ!</span>
                    </div>
                `;
                identityBox.className = "inline-flex items-center gap-6 text-4xl font-black p-5 rounded-3xl transition-all bg-gray-100 text-gray-400 opacity-40";
                footerSign.innerText = "≠";
            }
        }
    </script>
</body>
</html>
