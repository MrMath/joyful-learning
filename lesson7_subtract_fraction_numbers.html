<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق طرح الأعداد الكسرية التفاعلي</title>
    <style>
        /* تنسيقات CSS */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .app-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 700px;
            width: 90%;
        }

        h1 { color: #2c3e50; margin-bottom: 30px; }

        .problem-box {
            background: #eef2f3;
            padding: 20px;
            border-radius: 15px;
            display: inline-block;
            margin-bottom: 20px;
        }

        .math-text {
            font-size: 3rem;
            font-weight: bold;
            color: #34495e;
        }

        .fraction {
            display: inline-block;
            text-align: center;
            vertical-align: middle;
            font-size: 1.8rem;
            margin: 0 5px;
        }

        .fraction span {
            display: block;
            padding: 0 5px;
        }

        .fraction span.bottom {
            border-top: 3px solid #34495e;
        }

        .visual-display {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
            min-height: 120px;
        }

        /* تمثيل العدد الصحيح */
        .whole-unit {
            width: 70px;
            height: 70px;
            background-color: #3498db;
            border: 3px solid #2980b9;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            transition: all 0.5s ease;
        }

        /* تمثيل الكسر */
        .fraction-unit {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 2px;
            width: 74px;
            height: 74px;
            background: #ddd;
            border: 2px solid #999;
            padding: 2px;
        }

        .part {
            background-color: #bdc3c7; /* لون الأجزاء الفارغة */
            border: 1px solid #fff;
        }

        .part.active { background-color: #e67e22; } /* لون البسط */

        .instruction-text {
            font-size: 1.2rem;
            color: #7f8c8d;
            margin: 20px 0;
        }

        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.3rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.3);
            transition: 0.3s;
        }

        button:hover {
            background-color: #2ecc71;
            transform: translateY(-2px);
        }

        .result-panel {
            margin-top: 30px;
            padding: 20px;
            border-top: 2px dashed #bdc3c7;
            display: none;
            animation: fadeIn 1s;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="app-container">
    <h1>طرح الأعداد الكسرية بالاستلاف</h1>

    <div class="problem-box">
        <div class="math-text">
            5 <div class="fraction"><span>1</span><span class="bottom">7</span></div>
            - 
            2 <div class="fraction"><span>4</span><span class="bottom">7</span></div>
        </div>
    </div>

    <p id="hint" class="instruction-text">نلاحظ أن 1 أصغر من 4، لذا نحتاج للاستلاف من الـ 5.</p>

    <div id="visual-area" class="visual-display">
        <!-- سيتم توليد الوحدات بواسطة JS -->
    </div>

    <button id="btn-action" onclick="handleStep()">استلف من العدد الصحيح</button>

    <div id="result" class="result-panel">
        <h3>العملية بعد الاستلاف:</h3>
        <div class="math-text" style="font-size: 2rem;">
            4 <div class="fraction"><span>8</span><span class="bottom">7</span></div>
            - 
            2 <div class="fraction"><span>4</span><span class="bottom">7</span></div>
            = 
            <span style="color: #27ae60;">2 <div class="fraction"><span>4</span><span class="bottom">7</span></div></span>
        </div>
    </div>
</div>

<script>
    let step = 0;
    const visualArea = document.getElementById('visual-area');
    const hint = document.getElementById('hint');
    const btn = document.getElementById('btn-action');
    const resultPanel = document.getElementById('result');

    // دالة لإنشاء الوحدات المرئية
    function render(whole, fractionNumerator) {
        visualArea.innerHTML = '';
        
        // رسم الأعداد الصحيحة
        for (let i = 0; i < whole; i++) {
            let div = document.createElement('div');
            div.className = 'whole-unit';
            div.innerText = '1';
            visualArea.appendChild(div);
        }

        // رسم الكسر (مربع مقسم لـ 7 أجزاء)
        let fracDiv = document.createElement('div');
        fracDiv.className = 'fraction-unit';
        for (let i = 0; i < 7; i++) {
            let p = document.createElement('div');
            p.className = 'part' + (i < fractionNumerator ? ' active' : '');
            fracDiv.appendChild(p);
        }
        visualArea.appendChild(fracDiv);
    }

    // الخطوة الأولى: العرض المبدئي
    render(5, 1);

    function handleStep() {
        if (step === 0) {
            // تنفيذ عملية الاستلاف
            render(4, 8); // 4 صحيحة والكسر أصبح 8 أجزاء (7+1)
            
            hint.innerHTML = "تم تحويل واحد صحيح إلى 7 أجزاء، فأصبح البسط $1 + 7 = 8$.";
            btn.innerText = "عرض الناتج النهائي";
            step = 1;
        } else if (step === 1) {
            // عرض النتيجة
            resultPanel.style.display = 'block';
            btn.style.display = 'none';
            hint.innerText = "تمت العملية بنجاح! نطرح الصحيح من الصحيح والكسر من الكسر.";
        }
    }
</script>

</body>
</html>
