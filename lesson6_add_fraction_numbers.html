<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مختبر جمع الكسور - الترتيب العالمي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #f8fafc; }
        
        /* الحاوية الرئيسية للمعادلة - إجبار الترتيب من اليسار لليمين */
        .math-container {
            display: flex !important;
            flex-direction: row !important; /* ترتيب العناصر كصفوف */
            direction: ltr !important;      /* اتجاه من اليسار لليمين */
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 30px;
            background: white;
            border-radius: 24px;
        }

        /* تنسيق العدد الكسري ليحافظ على الصحيح يساراً والكسر يميناً */
        .mixed-number {
            display: flex;
            flex-direction: row;
            align-items: center;
            direction: ltr !important;
            gap: 8px;
            font-weight: 900;
            font-size: 2.8rem;
            color: #1e293b;
        }

        .fraction {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1;
            font-size: 1.8rem;
        }
        .fraction .num { border-bottom: 3px solid #64748b; padding: 0 4px; }
        .fraction .den { padding: 0 4px; }

        /* تنسيق الرموز الرياضية */
        .math-symbol {
            font-size: 2.5rem;
            color: #94a3b8;
            font-weight: bold;
        }

        /* تنسيق علامة الاستهام - التأكد من عدم انعكاسها */
        .question-placeholder {
            background: #eef2ff;
            color: #4f46e5;
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            border: 3px dashed #c7d2fe;
            font-size: 3rem;
            font-weight: 900;
            /* منع المتصفح من عكس علامة الاستهام العربية */
            unicode-bidi: bidi-override; 
        }

        .drag-item { cursor: grab; transition: all 0.2s; user-select: none; }
        .drag-item:active { cursor: grabbing; transform: scale(0.95); }
        .drop-zone { transition: all 0.3s; min-height: 150px; border: 3px dashed #cbd5e1; position: relative; }
        .drop-zone.drag-over { background-color: #f1f5f9; border-color: #4f46e5; transform: scale(1.02); }
        
        @keyframes pop {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: pop 0.4s ease-out forwards; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto bg-white rounded-[2rem] shadow-2xl overflow-hidden border border-slate-100">
        <div class="bg-indigo-600 p-8 text-white text-center">
            <h1 class="text-3xl font-black mb-2">🧪 مختبر جمع الأعداد الكسرية</h1>
            <p class="text-indigo-100 font-bold">المعادلة تبدأ من اليسار وتنتهي عند علامة (؟) في اليمين</p>
        </div>

        <div class="p-6 md:p-10">
            <!-- منطقة السؤال الرياضي -->
            <div id="math-question" class="math-container shadow-inner border-2 border-slate-50 mb-10">
                <!-- العناصر سيتم حقنها هنا بالترتيب البرمجي من اليسار لليمين -->
            </div>

            <!-- موازين السحب والإفلات -->
            <div class="grid md:grid-cols-2 gap-8 mb-10">
                <div class="flex flex-col">
                    <label class="text-blue-700 font-black mb-3 flex items-center gap-2">
                        <span class="w-8 h-8 bg-blue-100 rounded-lg flex items-center justify-center text-blue-600">1</span>
                        ميزان الأعداد الصحيحة
                    </label>
                    <div id="zone-whole" class="drop-zone rounded-3xl flex flex-wrap gap-4 p-6 justify-center items-center bg-blue-50/50" 
                         ondragover="event.preventDefault(); this.classList.add('drag-over')" 
                         ondragleave="this.classList.remove('drag-over')"
                         ondrop="handleDrop(event, 'whole')">
                         <div class="absolute opacity-10 pointer-events-none text-5xl font-black">1, 2, 3</div>
                    </div>
                </div>

                <div class="flex flex-col">
                    <label class="text-orange-600 font-black mb-3 flex items-center gap-2">
                        <span class="w-8 h-8 bg-orange-100 rounded-lg flex items-center justify-center text-orange-600">½</span>
                        ميزان الكسور
                    </label>
                    <div id="zone-frac" class="drop-zone rounded-3xl flex flex-wrap gap-4 p-6 justify-center items-center bg-orange-50/50"
                         ondragover="event.preventDefault(); this.classList.add('drag-over')" 
                         ondragleave="this.classList.remove('drag-over')"
                         ondrop="handleDrop(event, 'frac')">
                         <div class="absolute opacity-10 pointer-events-none text-5xl font-black">½, ¼</div>
                    </div>
                </div>
            </div>

            <!-- مخزن العناصر القابلة للسحب -->
            <div class="bg-slate-50 p-8 rounded-[2rem] border-2 border-dashed border-slate-200">
                <p class="text-center text-slate-400 font-bold mb-6 text-sm uppercase tracking-widest italic">اسحب المكونات من هنا إلى الموازين أعلاه:</p>
                <div id="draggable-pool" class="flex flex-wrap justify-center gap-6">
                    <!-- سيتم توليد العناصر هنا -->
                </div>
            </div>

            <!-- لوحة النتيجة -->
            <div id="result-panel" class="mt-10 hidden animate-pop">
                <div class="bg-emerald-50 border-4 border-emerald-200 rounded-[2.5rem] p-8 shadow-xl text-center">
                    <h3 class="text-emerald-700 text-2xl font-black mb-6">احسنت! التفكيك صحيح ✅</h3>
                    <div class="flex flex-col md:flex-row justify-center items-center gap-6 bg-white p-6 rounded-2xl mb-6 shadow-sm">
                        <div class="text-center">
                            <p class="text-xs text-slate-400 font-bold uppercase mb-1">مجموع الصحيح</p>
                            <span id="res-w" class="text-5xl font-black text-blue-600"></span>
                        </div>
                        <span class="text-3xl text-slate-300 font-bold">+</span>
                        <div class="text-center">
                            <p class="text-xs text-slate-400 font-bold uppercase mb-1">مجموع الكسور</p>
                            <div id="res-f" class="text-5xl font-black text-orange-500 flex justify-center"></div>
                        </div>
                    </div>
                    <div class="bg-emerald-600 text-white p-6 rounded-2xl inline-block px-12">
                        <p class="text-emerald-100 text-sm font-bold mb-1">النتيجة النهائية:</p>
                        <div id="final-res" class="text-5xl font-black"></div>
                    </div>
                    <button onclick="nextQuestion()" class="block w-full mt-8 bg-indigo-600 hover:bg-indigo-700 text-white text-2xl font-black py-5 rounded-2xl transition-all shadow-lg active:scale-95">السؤال التالي ➡️</button>
                </div>
            </div>

            <div id="error-toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-red-600 text-white px-8 py-4 rounded-full font-bold shadow-2xl hidden z-50 animate-pop"></div>
        </div>
    </div>

    <script>
        const questions = [
            { w1: 1, n1: 1, d1: 4, w2: 2, n2: 2, d1: 4, n2: 2, d2: 4 },
            { w1: 3, n1: 1, d1: 5, w2: 1, n2: 3, d2: 5 },
            { w1: 2, n1: 2, d1: 8, w2: 4, n2: 5, d2: 8 }
        ];

        let currentIdx = 0;
        let droppedItems = { whole: [], frac: [] };

        window.onload = loadQuestion;

        function createMixedHtml(w, n, d) {
            return `
                <div class="mixed-number">
                    <span>${w}</span>
                    <div class="fraction">
                        <span class="num">${n}</span>
                        <span class="den">${d}</span>
                    </div>
                </div>
            `;
        }

        function loadQuestion() {
            const q = questions[currentIdx % questions.length];
            droppedItems = { whole: [], frac: [] };
            
            document.getElementById('zone-whole').innerHTML = '<div class="absolute opacity-10 pointer-events-none text-5xl font-black">1, 2, 3</div>';
            document.getElementById('zone-frac').innerHTML = '<div class="absolute opacity-10 pointer-events-none text-5xl font-black">½, ¼</div>';
            document.getElementById('result-panel').classList.add('hidden');
            
            const qContainer = document.getElementById('math-question');
            // ملاحظة: الترتيب في الكود أدناه هو من اليسار إلى اليمين
            qContainer.innerHTML = `
                ${createMixedHtml(q.w1, q.n1, q.d1)}
                <span class="math-symbol">+</span>
                ${createMixedHtml(q.w2, q.n2, q.d2)}
                <span class="math-symbol">=</span>
                <div class="question-placeholder">؟</div>
            `;

            const pool = document.getElementById('draggable-pool');
            pool.innerHTML = '';
            
            const items = [
                { type: 'whole', val: q.w1, id: 'w1' },
                { type: 'whole', val: q.w2, id: 'w2' },
                { type: 'frac', val: {n: q.n1, d: q.d1}, id: 'f1' },
                { type: 'frac', val: {n: q.n2, d: q.d2}, id: 'f2' }
            ].sort(() => Math.random() - 0.5);

            items.forEach(item => {
                const div = document.createElement('div');
                div.className = "drag-item bg-white p-6 rounded-2xl shadow-lg border-2 border-slate-100 flex items-center justify-center min-w-[120px]";
                div.draggable = true;
                div.id = item.id;
                div.setAttribute('data-type', item.type);
                div.setAttribute('data-val', JSON.stringify(item.val));
                
                if(item.type === 'whole') {
                    div.innerHTML = `<span class="text-5xl font-black text-blue-600">${item.val}</span>`;
                } else {
                    div.innerHTML = `
                        <div class="fraction text-orange-500 font-black" style="font-size: 2.5rem;">
                            <span class="num">${item.val.n}</span>
                            <span class="den">${item.val.d}</span>
                        </div>
                    `;
                }

                div.ondragstart = (e) => {
                    e.dataTransfer.setData('text/plain', e.target.id);
                    e.target.style.opacity = '0.4';
                };
                div.ondragend = (e) => e.target.style.opacity = '1';
                pool.appendChild(div);
            });
        }

        function handleDrop(e, targetType) {
            e.preventDefault();
            const zone = e.currentTarget;
            zone.classList.remove('drag-over');
            
            const id = e.dataTransfer.getData('text/plain');
            const item = document.getElementById(id);
            if (!item) return;

            const itemType = item.getAttribute('data-type');
            const itemVal = JSON.parse(item.getAttribute('data-val'));

            if (itemType !== targetType) {
                showToast(`❌ عذراً! هذا ${itemType === 'whole' ? 'عدد صحيح' : 'كسر'}. ضعه في الميزان الصحيح.`);
                return;
            }

            zone.appendChild(item);
            droppedItems[targetType].push(itemVal);
            
            const totalDropped = document.querySelectorAll('.drop-zone .drag-item').length;
            if (totalDropped === 4) {
                setTimeout(showResults, 400);
            }
        }

        function showResults() {
            const q = questions[currentIdx % questions.length];
            const sumW = q.w1 + q.w2;
            const sumN = q.n1 + q.n2;
            const sumD = q.d1;

            document.getElementById('res-w').innerText = sumW;
            document.getElementById('res-f').innerHTML = `
                <div class="fraction">
                    <span class="num">${sumN}</span>
                    <span class="den">${sumD}</span>
                </div>
            `;
            
            document.getElementById('final-res').innerHTML = createMixedHtml(sumW, sumN, sumD);
            document.getElementById('result-panel').classList.remove('hidden');
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function showToast(msg) {
            const toast = document.getElementById('error-toast');
            toast.innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        function nextQuestion() {
            currentIdx++;
            loadQuestion();
        }
    </script>
</body>
</html>
